version: 1
project:
  id: portfolio
  name: Mauricio Portfolio
  repository: mauricioyepesstudio/mauricio-portfolio
  canonical_path_windows: C:\\Projects\\mauricio-portfolio
  ai_ops_worktree_windows: C:\\AI-OPS\\portfolio

git:
  canonical_branch: main
  canonical_commit_at_registration: b2332b903bc70054dfa04769528629373d5d4b3e
  control_plane_branch: work/ai-control-plane-v1
  production_branch: null
  merge_requires_owner_approval: true
  force_push: blocked

runtime:
  framework: nextjs
  local_port: null
  local_port_status: requires-verification

services:
  vercel:
    project_id: null
    status: requires-verification
    production_deploy_requires_owner_approval: true

boundaries:
  allowed_repository: mauricioyepesstudio/mauricio-portfolio
  forbidden_projects:
    - belong
    - pros360era
    - marketing-ai-platform
  cross_project_write: blocked
  secrets_read: blocked
  external_publish: owner-approval
  public_application_submit: owner-approval
  portfolio_publish: owner-approval

activation:
  state: registry-only
  autonomous_execution: false
  required_before_activation:
    - service identities verified
    - deterministic validation commands recorded
    - security review passes
    - owner approves activation
