version: 1
project: portfolio
manifest: .ai/PROJECT_MANIFEST.yaml
orchestrator:
  max_parallel_tasks: 4
  requires_review: true
  must_validate_project_identity: true
  stop_on_boundary_violation: true
agents:
  - {id: portfolio_strategy, area: execution, autonomy: L1, can_write: true}
  - {id: ux, area: execution, autonomy: L1, can_write: true}
  - {id: frontend, area: execution, autonomy: L1, can_write: true}
  - {id: content, area: execution, autonomy: L1, can_write: true}
  - {id: visual_qa, area: assurance, autonomy: L0, can_write: false}
  - {id: accessibility, area: assurance, autonomy: L0, can_write: false}
  - {id: seo, area: execution, autonomy: L1, can_write: true}
  - {id: career, area: execution, autonomy: L1, can_write: true}
  - {id: qa, area: assurance, autonomy: L0, can_write: false}
  - {id: reviewer, area: assurance, autonomy: L0, can_write: false}
policies:
  autonomous_execution: false
  default_external_action: blocked
  default_production_write: blocked
  cross_project_write: blocked
  secret_access: blocked
  destructive_operation: blocked
  merge: owner-approval
  production_deploy: owner-approval
  public_publish: owner-approval
  paid_spend: owner-approval
  require_independent_reviewer: true
  proof_required_for_done: true
