name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Install isolated browser QA tooling
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.62.1
          npx playwright install --with-deps chromium

      - name: Verify home responsive and contact navigation
        run: node scripts/qa-home-responsive.mjs

      - name: Verify contact confirmation and safe retry (mocked delivery only)
        run: node scripts/qa-contact-confirmation.mjs

      - name: Verify services plans and Resource Living campaign order
        run: node scripts/qa-services.mjs
